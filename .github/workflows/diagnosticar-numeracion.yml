name: Diagnóstico de numeración de artículos (documento real)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL(s) de documento(s) a diagnosticar, separadas por espacio"
        required: false
        default: ""
      verificar_cobertura_url:
        description: "Si se pasa, en vez del diagnóstico de numeración corre verificar_cobertura_documento.py sobre esta URL (compara el texto real contra lo indexado en la BD)"
        required: false
        default: ""
      verificar_cobertura_articulo:
        description: "numero_articulo puntual a verificar junto con verificar_cobertura_url (opcional)"
        required: false
        default: ""
      inspeccionar_busqueda_pregunta:
        description: "Si se pasa, corre buscar_fragmentos_relevantes() directamente (sin agente, sin llamada a Anthropic) con esta pregunta y muestra los top_k candidatos crudos"
        required: false
        default: ""
      inspeccionar_busqueda_numero_articulo:
        description: "numero_articulo a verificar si está entre los candidatos de inspeccionar_busqueda_pregunta (opcional); si no está, muestra su texto completo almacenado"
        required: false
        default: ""
      diagnosticar_longitud_et:
        description: "Si es 'true', mide la longitud de todos los fragmentos del ET ya almacenados (riesgo de dilución del embedding, mismo patrón que el artículo 879)"
        required: false
        type: boolean
        default: false
      diagnosticar_longitud_umbral:
        description: "Umbral de caracteres para diagnosticar_longitud_et (opcional, default 26627 = longitud del art. 879)"
        required: false
        default: ""
      diagnosticar_longitud_numero_articulo:
        description: "numero_articulo puntual a reportar junto con diagnosticar_longitud_et (opcional, ej. 476)"
        required: false
        default: ""
      diagnosticar_colisiones_url:
        description: "Si se pasa, corre diagnosticar_colisiones_headers.py sobre esta URL: solo lectura, identifica los casos donde una cita cruzada espuria 'ganó' un numero_articulo que le correspondía a otro header real (compara contenido actual en BD vs. el que lo reemplazaría). No borra ni inserta nada."
        required: false
        default: ""
      corregir_colisiones_url:
        description: "MODO DE ESCRITURA: borra las filas identificadas por diagnosticar_colisiones_url sobre esta URL y reingiere el documento para reinsertar el contenido correcto. Correr diagnosticar_colisiones_url primero — no se puede combinar con él en la misma corrida."
        required: false
        default: ""
      prototipo_fragmentacion_url:
        description: "Si se pasa (junto con prototipo_fragmentacion_articulo), corre el prototipo de solo reporte de fragmentación por numeral sobre este documento. No toca la BD ni escribe nada."
        required: false
        default: ""
      prototipo_fragmentacion_articulo:
        description: "numero_articulo a probar con prototipo_fragmentacion_url (ej. 879)"
        required: false
        default: ""
      investigar_numeral_url:
        description: "Si se pasa (junto con investigar_numeral_articulo e investigar_numeral_etiqueta), corre investigar_numeral_faltante.py: solo lectura, sin BD. Muestra los matches crudos de detección de numerales y el contenido completo del fragmento indicado."
        required: false
        default: ""
      investigar_numeral_articulo:
        description: "numero_articulo a investigar con investigar_numeral_url (ej. 260-11)"
        required: false
        default: ""
      investigar_numeral_etiqueta:
        description: "etiqueta de numeral cuyo fragmento completo se debe imprimir (ej. 2)"
        required: false
        default: ""

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      # app.database exige DATABASE_URL al importarse (RuntimeError si
      # falta), aunque el diagnóstico de numeración no ejecute ninguna
      # consulta (los otros dos modos sí, en modo de solo lectura).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Diagnóstico de numeración (solo lectura, sin BD)
        if: ${{ github.event.inputs.verificar_cobertura_url == '' && github.event.inputs.inspeccionar_busqueda_pregunta == '' && github.event.inputs.diagnosticar_longitud_et != 'true' && github.event.inputs.diagnosticar_colisiones_url == '' && github.event.inputs.corregir_colisiones_url == '' && github.event.inputs.prototipo_fragmentacion_url == '' && github.event.inputs.investigar_numeral_url == '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          URLS: ${{ github.event.inputs.urls }}
        run: python scripts/diagnosticar_numeracion_documento.py $URLS

      - name: Verificar cobertura de indexación (solo lectura, con BD)
        if: ${{ github.event.inputs.verificar_cobertura_url != '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          URL_DOCUMENTO: ${{ github.event.inputs.verificar_cobertura_url }}
          ARTICULO: ${{ github.event.inputs.verificar_cobertura_articulo }}
        run: |
          ARGS=(scripts/verificar_cobertura_documento.py "$URL_DOCUMENTO")
          if [ -n "$ARTICULO" ]; then
            ARGS+=(--articulo "$ARTICULO")
          fi
          python "${ARGS[@]}"

      - name: Inspeccionar búsqueda semántica (solo lectura, con BD + Voyage)
        if: ${{ github.event.inputs.inspeccionar_busqueda_pregunta != '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          PREGUNTA: ${{ github.event.inputs.inspeccionar_busqueda_pregunta }}
          NUMERO_ARTICULO: ${{ github.event.inputs.inspeccionar_busqueda_numero_articulo }}
        run: |
          ARGS=(scripts/inspeccionar_busqueda_semantica.py "$PREGUNTA")
          if [ -n "$NUMERO_ARTICULO" ]; then
            ARGS+=(--numero-articulo "$NUMERO_ARTICULO")
          fi
          python "${ARGS[@]}"

      - name: Diagnosticar longitud de fragmentos del ET (solo lectura, con BD)
        if: ${{ github.event.inputs.diagnosticar_longitud_et == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          UMBRAL: ${{ github.event.inputs.diagnosticar_longitud_umbral }}
          NUMERO_ARTICULO: ${{ github.event.inputs.diagnosticar_longitud_numero_articulo }}
        run: |
          ARGS=(scripts/diagnosticar_longitud_fragmentos_et.py --top 10)
          if [ -n "$UMBRAL" ]; then
            ARGS+=(--umbral "$UMBRAL")
          fi
          if [ -n "$NUMERO_ARTICULO" ]; then
            ARGS+=(--numero-articulo "$NUMERO_ARTICULO")
          fi
          python "${ARGS[@]}"

      - name: Diagnosticar colisiones de header (solo lectura, con BD)
        if: ${{ github.event.inputs.diagnosticar_colisiones_url != '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          URL_DOCUMENTO: ${{ github.event.inputs.diagnosticar_colisiones_url }}
        run: python scripts/diagnosticar_colisiones_headers.py "$URL_DOCUMENTO"

      - name: Corregir colisiones de header (MODO DE ESCRITURA, con BD)
        if: ${{ github.event.inputs.corregir_colisiones_url != '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          URL_DOCUMENTO: ${{ github.event.inputs.corregir_colisiones_url }}
        run: python scripts/aplicar_correccion_colisiones_headers.py "$URL_DOCUMENTO"

      - name: Prototipo de fragmentación por numeral (solo reporte, sin BD)
        if: ${{ github.event.inputs.prototipo_fragmentacion_url != '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          URL_DOCUMENTO: ${{ github.event.inputs.prototipo_fragmentacion_url }}
          NUMERO_ARTICULO: ${{ github.event.inputs.prototipo_fragmentacion_articulo }}
        run: python scripts/prototipo_fragmentacion_numeral.py "$URL_DOCUMENTO" "$NUMERO_ARTICULO"

      - name: Investigar numeral faltante (solo reporte, sin BD)
        if: ${{ github.event.inputs.investigar_numeral_url != '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          URL_DOCUMENTO: ${{ github.event.inputs.investigar_numeral_url }}
          NUMERO_ARTICULO: ${{ github.event.inputs.investigar_numeral_articulo }}
          ETIQUETA: ${{ github.event.inputs.investigar_numeral_etiqueta }}
        run: python scripts/investigar_numeral_faltante.py "$URL_DOCUMENTO" "$NUMERO_ARTICULO" "$ETIQUETA"
