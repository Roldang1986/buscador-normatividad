name: Consulta ad hoc (POST /consulta)

on:
  workflow_dispatch:
    inputs:
      pregunta:
        description: "Pregunta a probar contra POST /consulta"
        required: true

jobs:
  consulta:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt httpx

      - name: Correr migraciones (alembic upgrade head)
        run: alembic upgrade head

      - name: Consulta ad hoc
        env:
          PYTHONPATH: ${{ github.workspace }}
          PREGUNTA: ${{ github.event.inputs.pregunta }}
        run: python scripts/consulta_ad_hoc.py "$PREGUNTA"
