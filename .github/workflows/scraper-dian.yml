name: Scraper DIAN (prueba)

on:
  workflow_dispatch:
    inputs:
      seccion:
        description: "Texto del encabezado de la sección del índice a scrapear"
        required: false
        default: "1.1. Estatuto Tributario"
      limite:
        description: "Máximo de documentos a descubrir en la sección"
        required: false
        default: "3"
      limite_fragmentos_por_documento:
        description: "Máximo de fragmentos (artículos) a insertar por cada documento individual (vacío = sin límite). Necesario para documentos consolidados grandes como el Estatuto Tributario compilado."
        required: false
        default: ""
      limpiar_truncados:
        description: "Borrar antes de scrapear las normas con numero_articulo truncado en un guión (bug de ARTICULO_HEADER_RE ya corregido)"
        required: false
        type: boolean
        default: false
      solo_verificar_numeracion:
        description: "No scrapear nada: solo imprimir el diagnóstico de numeración de artículos (truncados restantes, artículos 631-*, numero_articulo con letras no ordinales)"
        required: false
        type: boolean
        default: false
      solo_descubrir:
        description: "No descarga ni inserta nada en la BD: solo corre el descubrimiento en el índice e imprime los documentos encontrados + conteo de indice_marca_derogado. Combinar con capturas para inspeccionar el HTML del DOM."
        required: false
        type: boolean
        default: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador de Playwright
        run: playwright install --with-deps chromium

      - name: Correr migraciones (alembic upgrade head)
        run: alembic upgrade head

      - name: Scraper DIAN (subconjunto de prueba)
        env:
          PYTHONPATH: ${{ github.workspace }}
          SECCION: ${{ github.event.inputs.seccion }}
          LIMITE: ${{ github.event.inputs.limite }}
          LIMITE_FRAGMENTOS: ${{ github.event.inputs.limite_fragmentos_por_documento }}
          LIMPIAR_TRUNCADOS: ${{ github.event.inputs.limpiar_truncados }}
          SOLO_VERIFICAR: ${{ github.event.inputs.solo_verificar_numeracion }}
          SOLO_DESCUBRIR: ${{ github.event.inputs.solo_descubrir }}
        run: |
          ARGS=(scripts/run_dian_scraper.py "$SECCION" --limite "$LIMITE" --capturas-dir scraper-debug)
          if [ -n "$LIMITE_FRAGMENTOS" ]; then
            ARGS+=(--limite-fragmentos-por-documento "$LIMITE_FRAGMENTOS")
          fi
          if [ "$LIMPIAR_TRUNCADOS" = "true" ]; then
            ARGS+=(--limpiar-truncados)
          fi
          if [ "$SOLO_VERIFICAR" = "true" ]; then
            ARGS+=(--solo-verificar-numeracion)
          fi
          if [ "$SOLO_DESCUBRIR" = "true" ]; then
            ARGS+=(--solo-descubrir)
          fi
          python "${ARGS[@]}"

      - name: Diagnóstico de DOM (solo lectura, sobre el HTML ya guardado)
        if: always()
        env:
          SECCION: ${{ github.event.inputs.seccion }}
        run: |
          if [ -f "scraper-debug/01_antes_del_clic.html" ]; then
            python scripts/diagnosticar_dom.py scraper-debug "$SECCION"
          else
            echo "No hay HTML guardado en scraper-debug/, se omite el diagnóstico."
          fi

      - name: Subir capturas de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-screenshots
          path: scraper-debug/
          if-no-files-found: ignore
